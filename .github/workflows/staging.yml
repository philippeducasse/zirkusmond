name: deploy-staging

on:
  push:
    branches:
      - staging

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: cd backend && uv sync

      - name: Run tests
        run: cd backend && uv run pytest

  build_and_deploy_image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Django image
        run: docker build -f deploy/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/zirkusmond:staging .

      - name: Push to registry
        run: docker push ${{ secrets.DOCKER_USERNAME }}/zirkusmond:staging

      - name: Prepare .env file
        run: |
          cp deploy/.env.basic .env
          echo "" >> .env  
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env
          echo "DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "BREVO_API_KEY=${{ secrets.MAILER_TOKEN }}" >> .env
          echo "PAYPAL_SANDBOX_CLIENT_ID=${{ secrets.PAYPAL_SANDBOX_CLIENT_ID }}" >> .env
          echo "PAYPAL_SANDBOX_SECRET=${{ secrets.PAYPAL_SANDBOX_SECRET }}" >> .env
          echo "STRIPE_TEST_TOKEN=${{ secrets.STRIPE_TEST_TOKEN }}" >> .env
          echo "STRIPE_HOOK_TOKEN=${{ secrets.STRIPE_HOOK_TOKEN }}" >> .env

      - name: Get changed files in deploy folder
        id: changed-files-deploy
        uses: tj-actions/changed-files@7dee1b0c1557f278e5c7dc244927139d78c0e22a # v47.0.4
        with:
          files: |
            deploy/staging/docker-compose.yml
            deploy/staging/staging_zirkusmond.conf

      - name: Copy .env file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".env"
          target: "~/staging_zirkusmond/"

      - name: Copy nginx config to server
        # if: steps.changed-files-deploy.outputs.any_changed == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/staging/staging_zirkusmond.conf"
          target: "/home/ubuntu/nginx/sites.d/"
          strip_components: 2

      - name: Copy docker-compose to server
        # if: steps.changed-files-deploy.outputs.any_changed == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/staging/docker-compose.yml"
          target: "~/staging_zirkusmond/"
          strip_components: 2

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/staging_zirkusmond
            docker compose pull
            docker compose up -d postgres
            until docker compose exec -T postgres pg_isready -U mond; do sleep 2; done
            docker compose stop django || true
            docker exec ubuntu-postgres-1 pg_dump -U mond monddb > ~/zirkusmond_latest.sql
            docker compose exec -T postgres psql -U mond -d postgres -c "DROP DATABASE IF EXISTS monddb;"
            docker compose exec -T postgres psql -U mond -d postgres -c "CREATE DATABASE monddb;"
            docker compose exec -T postgres psql -U mond monddb < ~/zirkusmond_latest.sql
            docker run --rm -v ubuntu_zm_media:/src:ro -v staging_zirkusmond_zm_media:/dst alpine sh -c "mkdir -p /dst/media && cp -a /src/media/. /dst/media/"
            docker compose up -d --remove-orphans
            docker image prune -f
            docker exec ubuntu-nginx-1 nginx -s reload || true
