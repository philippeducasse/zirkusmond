{% extends "admin/base_site.html" %}
{% load static %}

{% block content %}
  <div class="module">
    <h1>{{ title }}</h1>
    <p>{{ subtitle }}</p>
    <form method="post" novalidate>
      {% csrf_token %}
      <fieldset class="module aligned">
        {{ form.as_p }}
      </fieldset>
      <input type="submit" value="Run" class="default">
    </form>
  </div>
{% endblock %}
