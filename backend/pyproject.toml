[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django-payments==3.1.0",
    "django-image-cropping==1.7",
    "easy_thumbnails==2.10.1",
    "jupyter_nbextensions_configurator==0.6.4",
    "django_extensions==4.1",
    "xlsxwriter==3.2.9",
    "gunicorn==26.0.0",
    "imaplib2==3.6",
    "xmltodict==1.0.4",
    "psycopg2-binary==2.9.12",
    "stripe==15.2.0",
    "qrcode[pil]==8.2",
    "django-tinymce==5.0.0",
    "reportlab==4.5.1",
    "django-anymail==15.0",
    "pytest-django==4.12.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "ruff",
]