
  server {
      listen 80;
      server_name testing.zirkusmond.de;

      location /.well-known/acme-challenge/ {
          root /var/www/acme-challenge;
      }

      location / {
          return 301 https://testing.zirkusmond.de$request_uri;
      }
  }

  server {
      listen 443 ssl;
      server_name testing.zirkusmond.de;

      ssl_certificate /certs/testing.zirkusmond.de/fullchain.pem;
      ssl_certificate_key /certs/testing.zirkusmond.de/privkey.pem;

      location / {
          resolver 127.0.0.11 valid=10s;
          set $upstream testing_zirkusmond_de:8000;
          proxy_pass http://$upstream;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_set_header Host $http_host;

          proxy_read_timeout      4600;
          proxy_connect_timeout   600;

          proxy_set_header    X-Real-IP           $remote_addr;
          proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
          proxy_set_header    X-Forwarded-Proto   $scheme;

          client_max_body_size 10M;
      }
  }