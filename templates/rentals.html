{% extends "html_base.html" %}
{% load static %}

{% block body %}

{% include "navbar.html" %}


<h2 class="text-6xl text-center py-8">Rentals</h2>
<section class="about-page flex flex-col">
    <div class="about-page__header">
        <div class="banner-image mx-auto mb-8">
            <img class="w-full" src="{% static "zm/img/rental_banner.jpg" %}" alt="Zirkus Mond Image">
        </div>
        <div class="about-text p-10 text-center">
            <h3 class="text-2xl md:text-4xl">Rent our Zirkus stuff!!</p>
            <p class="text-base py-8">Very very cheap, very very nice.</p>
        </div>
    </div>
    
        <!-- <h3 class="text-6xl text-center pt-10">Our gear</h3> -->
            <div class="deko"> <img class="mx-auto my-10" src="{% static "zm/img/deko-1.png" %}" alt="********"/> </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mx-2 my-4 gap-y-16">
              {% for object in rental_objects %}
                <div>
                  <img src="{{ MEDIA_URL }}{{ object.image }}" alt="stretch-tent" class="">
                </div>
                <div class="flex flex-col justify-evenly gap-3">
                  <h3 class="text-4xl text-center">{{ object.name }}</h3>
                  <p class="text-base md:text-xl">{{ object.description }}
                  </p>
                    <a href="{{ object.link }}" target="_blank" class="font-bold text-center text-2xl underline">Link</a>
                  </div>
                  {% endfor %}
                </div>
            </div>
        <div class="deko"> <img class="mx-auto my-12" src="{% static "zm/img/deko-2.png" %}" alt="********"/> </div>
</section>

{% endblock %}
