{% load static %}

<!doctype html>
<html lang="de">


<head>

    {% block head %}
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <meta name="description"    content="{% block head_description %}Zirkus Mond – zeitgenössischer Zirkus, Theater und Veranstaltungsort in Berlin. Contemporary Circus, Live Shows, Kultur und Community im Herzen Berlins.{% endblock %}">
    <link rel="canonical" href="https://zirkusmond.de/">

    <meta name="keywords"       content="Zirkus Mond, Zirkus Mond Berlin, zeitgenössischer Zirkus, moderner Zirkus, neuer Zirkus, zeitgenössischer Zirkus Berlin, moderner Zirkus Berlin, experimenteller Zirkus, Performance Zirkus, alternativer Zirkus, freier Zirkus, Contemporary Circus, New Circus, Circus, Circus Arts, Zirkuszelt Berlin, Veranstaltungsort Berlin, Kultur Berlin, freie Kulturszene Berlin, alternative Kultur Berlin, Performancekunst Berlin, darstellende Kunst Berlin, Live Kunst Berlin, nachhaltige Kultur, faire Kulturarbeit, unabhängige Kultur, freie Kunstszene, solidarische Kultur, kulturelle Vielfalt, inklusive Kultur, diverse Kunst, Zirkus ohne Tiere, Neuer Zirkus, Freier Zirkus, Unabhängiger Zirkus, Interdisziplinärer Zirkus, Experimenteller Zirkus, Postdramatischer Zirkus{% block head_keywords %}{% endblock %}">
    <link rel="shortcut icon" href="{% static "zm/img/logo.png" %}">
    <title>{% block title %}Zirkus Mond{% endblock %}</title>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Zirkus Mond" />
    <meta property="og:url" content="https://zirkusmond.de" />
    {% block og_image %}
    <meta property="og:image" content="https://zirkusmond.de/static/zm/img/zm_square.jpg" />
    {% endblock %}
    
    <script type="application/ld+json">
        {% block structured_data %}
        {
            "@context": "https://schema.org",
            "@type": "Organization",
            "name": "Zirkus Mond",
            "url": "https://zirkusmond.de",
            "logo": "https://zirkusmond.de/static/zm/img/zm_square.jpg"
        }
        {% endblock %}
    </script>

    {% endblock %}
    {% block head_js %}

    
    <link  href="{% static "zm/tailwind.css" %}" rel="stylesheet">
    <link rel="stylesheet" href="static/zm/node_modules/@glidejs/glide/dist/css/glide.core.min.css">
    {% endblock %}
</head>
    
</head>
<body >
<div>

    {% block body %}
    {% endblock %}
</div>
<script src="static/zm/node_modules/@glidejs/glide/dist/glide.min.js"></script>
<script>
    if (document.querySelector('.glide')) {
    new Glide('.glide').mount();
    }
    const header = document.querySelector('.navbar')
       if (window.location.pathname === '/'){
        window.addEventListener("scroll", function(){
            header.classList.toggle('sticky', window.scrollY > 100)
        })
    } else header.classList.add('sticky')
    
    const hamburger = document.querySelector('.hamburger');
    hamburger.addEventListener('click', function (){
        const mobileMenu = document.querySelector('.mobile-menu');
        hamburger.classList.toggle('open')
        mobileMenu.classList.toggle('hidden')
        mobileMenu.classList.toggle('flex')
    })    

    const eventCardText = document.querySelectorAll('.card-text');
    eventCardText.forEach((cardText) => {
        cardText.innerHTML = cardText.innerHTML.replace(/(\d{2}:\d{2})\//g, '$1<br>')
    })

    let spinner = document.querySelector('.spinner');
    let redirectingText = document.querySelector('.redirecting-text');
    let submitButtons = document.querySelectorAll('.button-payment')
    
    function showSpinner() {
                spinner.classList.remove('hide-spinner');
                redirectingText.classList.remove('hide-spinner')

                // Disable buttons to prevent multiple submissions
                submitButtons.forEach((btn) =>  
                 setTimeout(() => {
                    btn.disabled = true;
                    }, 1));
        };

    // hide spinner if navigates back to page
    window.addEventListener('pageshow', function() {
        spinner.classList.add('hide-spinner');
        redirectingText.classList.add('hide-spinner');

        submitButtons.forEach((btn) => btn.disabled = false);
    });

</script>

</body>
</html>
