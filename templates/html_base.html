{% load static %}

<!doctype html>
<html lang="de">


<head>

    {% block head %}
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <meta name="description"    content="Zirkus Mond is a contemporary Circus, Theater and Venue. {% block head_description %}{% endblock %}">
    <link rel="canonical" href="https://zirkusmond.de/">

    <meta name="keywords"       content="circus performing arts {% block head_keywords %}{% endblock %}">
    <link rel="shortcut icon" href="{% static "zm/img/logo.png" %}">
    <title>{% block title %}Zirkus Mond{% endblock %}</title>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Zirkus Mond" />
    <meta property="og:url" content="https://zirkusmond.de" />
    <meta property="og:image" content="https://zirkusmond.de/static/zm/img/zm_square.jpg" />

    {% endblock %}
    {% block head_js %}

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
   integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A=="
   crossorigin=""/>
    <link rel="stylesheet" type="text/css" href="/static/zm/node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="{% static "zm/design.css" %}">
    {% endblock %}
</head>
    
</head>
<body>
    {% block body %}
    {% endblock %}


    <script type="text/javascript" src="/static/zm/node_modules/jquery/dist/jquery.min.js"></script>
    <script type="text/javascript" src="/static/zm/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"
       integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA=="
       crossorigin=""></script>

</body>
</html>
