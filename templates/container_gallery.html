
{% load static %}


<div class="container-fluid shadowed-content" style="padding:0;">
    <div id="carouselGallery" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-indicators">
    {% for i in "01234567" %}
        <button type="button" data-bs-target="#carouselGallery" data-bs-slide-to="{{i}}" class="active" aria-current="true" aria-label="Slide {{i}}"></button>
    {% endfor %}
  </div>
  <div class="carousel-inner">
    {% for i in "01234567" %}
        <div class="carousel-item {% if forloop.first %}active{%endif%}">
            <img src="{% get_static_prefix %}zm/img/img-{{i}}.jpg" class="d-block w-100" alt="...">
        </div>
    {% endfor %}
    
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselGallery"  data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselGallery"  data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
</div>
