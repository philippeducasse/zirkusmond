{% extends "html_design.html" %}
{% load static %}
{% load markdown %}

{% block title %}Zirkus Mond - {{ show.title }}{% endblock %}

{% block content %}
        <img src="{{ MEDIA_URL }}{{ show.banner_link }}"
            style="width:100%;"></img>

        <div>
            <h1>{{ show.title }}</h1>
        </div>
        <div>
            {% block show_details %}
                {{ show.description | markdown | safe}}

                <div style="margin-top:2em;">
                <a class="button" href="/reserve/{{show.pk}}">Zur Reservierung</a>
                </div>
            {% endblock %}
        </div>
{% endblock %}
