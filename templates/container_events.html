{% extends "container_base.html" %}
{% load static %}

{% block container_name %}events{% endblock %}

{% block container_title %}
    EVENTS

{% block container_content %}

            <a href="/show/{{show.id}}">
                <div class=""><img src="{{ MEDIA_URL }}{{ show.banner_link }}"></img> </div>

        {% endfor %}
    </div>
{% endblock %}
