{% load static %}


<div class="container ">
    <div class="row">
    {% for show in upcoming_shows %}
        <div class="col-md">
        <a href="/show/{{show.id}}">
        <div class="card">
            <img class="card-img-top" src="{{MEDIA_URL}}{{show.banner_link}}" />
            <div class="card-body">
                <h3 class="card-title">{{ show.title }}</h3>
                <p class="card-text">{{ show.dates_text }}</p>
            </div>
        </div>
        </a>
        </div>
    {% endfor %}
    </div>
</div>
