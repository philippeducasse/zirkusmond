{% load static %}
{% load cropping %}


<div class="container ">
    {% if upcoming_shows|length|divisibleby:2 %}
        <div class="row row-cols-1 row-cols-lg-2 g-3">
    {% elif upcoming_shows|length|divisibleby:3 %}
        <div class="row row-cols-1 row-cols-lg-3 g-3">
    {% else %}
        <div class="row row-cols-1 g-3">
    {% endif %}

    {% for show in upcoming_shows %}
        <div class="col">
            <a href="/show/{{ show.id }}" class="h-100">
                <div class="card h-100">
                    <img class="card-img-top ratio ratio-16x9" src="{% cropped_thumbnail show "head_img" %}" />
                    <div class="card-body">
                        <h3 class="card-title">{{ show.title }}</h3>
                    </div>
                    <div class="card-footer">{{ show.dates_text }}</div>
                </div>
              </a>
        </div>
    {% endfor %}
    </div>
</div>
